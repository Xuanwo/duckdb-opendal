[package]
name = "duckdb_opendal_ffi"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
bytes = "1"
opendal = { version = "0.55", default-features = true }
tokio = { version = "1", features = ["rt-multi-thread"] }

[features]
default = ["services-s3", "services-fs"]
services-s3 = ["opendal/services-s3"]
services-fs = ["opendal/services-fs"]

