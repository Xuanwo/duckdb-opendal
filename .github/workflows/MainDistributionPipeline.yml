#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    # NOTE: v1.4.3/v1.4.4 are not usable on the current `windows-latest` image (VS2026):
    # - the ci-tools hardcode the VS2022 `vcvars64.bat` path, so MSVC setup fails silently and the
    #   build falls back to MinGW, which cannot link the msvc-built Rust staticlib;
    # - DuckDB < v1.4.5 bundled fmt 6.1.2, which uses `stdext::checked_array_iterator`, removed
    #   from the VS2026 STL, so it fails to compile with cl.exe 14.5x.
    # v1.4.5 + v1.4-andium ci-tools fix both (probe VS18/VS2026 vcvars, force CC/CXX=cl,
    # drop checked_array_iterator from fmt).
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.4-andium
    with:
      duckdb_version: v1.4.5
      ci_tools_version: v1.4-andium
      extension_name: opendal
      extra_toolchains: "rust"
      exclude_archs: "wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;osx_amd64"

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.4-andium
    with:
      duckdb_version: v1.4.5
      ci_tools_version: v1.4-andium
      extension_name: opendal
      format_checks: "format;tidy"
